<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Auto theme: class set late by the app</title>
<style>
  /* SPA pattern: html/body transparent, the app root paints the background,
     and the theme class is applied after hydration. */
  :root { --bg: #ffffff; --fg: #0f172a; --card: #f1f5f9; --border: #e2e8f0; --muted: #64748b; --accent: #0ea5e9; }
  html.dark { --bg: #020617; --fg: #e2e8f0; --card: #0f172a; --border: #1e293b; --muted: #94a3b8; --accent: #38bdf8; }
  body { margin: 0; font: 16px system-ui, sans-serif; }
  #app { min-height: 100vh; background: var(--bg); color: var(--fg); }
  header { padding: 16px 24px; border-bottom: 1px solid var(--border); }
  main { padding: 24px; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
  .muted { color: var(--muted); } a { color: var(--accent); }
</style></head>
<body>
  <div id="app">
    <header><b>Auto theme</b>: <code>html.dark</code> set 400 ms after load, background painted by <code>#app</code></header>
    <main>
      <div class="card" id="card"><h2>First card</h2><p class="muted" id="muted">Muted supporting text.</p><a href="#" id="link">A link</a></div>
      <div class="card"><h2>Second card</h2><p>Body text in the site's own theme.</p></div>
      <div class="card"><h2>Third card</h2><p class="muted">More muted text.</p></div>
      <div class="card"><h2>Fourth card</h2><p>The site supports dark mode by itself.</p></div>
    </main>
  </div>
  <script>
    const mq = matchMedia('(prefers-color-scheme: dark)');
    const apply = () => document.documentElement.classList.toggle('dark', mq.matches);
    setTimeout(apply, 400);
    mq.addEventListener('change', apply);
  </script>
</body></html>
